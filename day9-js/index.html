    <script>
            
            console.log("Hii guys I am Js")


            //Variable - IT IS LIKE BOX WHICH STORE THE DATA

            //1. var keyword


         var username = "Aryan"

         var password = 1234

         var password = 9876

         console.log(password)

         //2 . let keyword

         let priceofmilk = 50

         // priceofmilk = 100

         console.log(priceofmilk)


         let abc = "Hello"

         abc = "Good Evening"

         console.log(abc)

         //const keyword - FIXED

         const appName = "Amazon"

         console.log(appName)



         // Data Type - Different Types of Data

         //1. String - "Text" or 'Text'

         var email = "abc@gmail.com"

         console.log(  typeof(email)   )


          //2. Number - Whole , Decimal , Negative No

          var price = -99.99

          console.log( typeof(price) )

          //3 boolean - true or false
          var isLogin = false

          var canWatchMovie = true

          console.log(typeof(canWatchMovie))


          //4. undefined 
          var x;

          console.log(typeof(x))


          //5 null

          var discount = null

          console.log(  typeof(discount) )  
          //There is a Bug in Js null - It gives you object as Output


    </script>
