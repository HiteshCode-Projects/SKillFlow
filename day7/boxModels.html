<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         .product{
           border: 1px solid brown;
           border-radius: 12px;
           padding: 12px;
           margin: 15px;

           
           box-shadow: 0 4px 8px black;
           width: 250px;
           text-align: center;
           background-color: beige;

         }

        .product img{
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 12px;

         }

         .product button{
            background-color: blueviolet;
            padding: 10px;
            border: none;
            border-radius: 12px;
            color: white;
            width: 90%;
         }

         body{
            display: flex;
         }

    </style>
</head>
<body>

    <div class="product">
        <img src="https://images.pexels.com/photos/5269699/pexels-photo-5269699.jpeg">
        <h2>Headphone</h2>
        <p>Rs 2,499</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://images.pexels.com/photos/28743215/pexels-photo-28743215.jpeg" >
        <h2>GPU</h2>
        <p>Rs 5,000</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://images.pexels.com/photos/7857501/pexels-photo-7857501.jpeg" >
        <h2>Shoes</h2>
        <p>Rs 1,200</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://images.pexels.com/photos/30257619/pexels-photo-30257619.jpeg" >
        <h2>Hoodie</h2>
        <p>Rs 999</p>
        <button>Buy Now</button>
    </div>





</body>
</html>
